[target.'cfg(all())']
# NOTE that the web build overrides this setting in tools/build_wasm.ts via the RUSTFLAGS environment variable
rustflags = [
    # We need to specify this flag for all targets because Clippy checks all of our code against all targets
    # and our web code does not compile without this flag
    "--cfg=web_sys_unstable_apis",
]

[target.x86_64-pc-windows-msvc]
# Aumenta a stack para 64MB para evitar stack overflow durante recursão profunda do AVM2 (ex: AQW map changes)
# O rust-lld foi removido pois ignorava a flag /STACK
rustflags = ["-C", "link-arg=/STACK:134217728"]

[env]
# Set the minimum stack size for tests to 8 MiB.
# Otherwise some tests overflow the stack.
RUST_MIN_STACK = "8388608"
LOCAL_RUFFLE_TESTS_SWFS_DIR = { value = "tests/tests/swfs", relative = true }
FLASH_PLAYERS_TEST_CONFIG = { value = ".flash_players.toml", relative = true }

[alias]
testutils = "run --package tests --"
